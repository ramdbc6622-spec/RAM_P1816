<!-- @dsCard height=288 -->
<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Source+Serif+4&display=swap" rel="stylesheet">
<style>
  html,body{margin:0;background:var(--surface);}
  .c{position:relative;width:960px;height:288px;overflow:hidden;background:var(--surface)}
  svg{position:absolute;left:0;top:0}
  .navy{fill:var(--brand-block)} .gold{fill:var(--gold)} .goldl{fill:var(--gold-light)} .red{fill:var(--red)}
  .orbit{fill:none;stroke:var(--cream);stroke-width:1.5}
  .nuc{fill:var(--gold-light)}
  .name{position:absolute;left:40px;bottom:64px;max-width:440px;margin:0;font:700 72px/.95 var(--font-display);color:var(--ink)}
  .tag{position:absolute;left:40px;bottom:32px;max-width:440px;margin:0;font:400 14px/1.3 var(--font-serif);color:var(--muted)}
</style>
</head>
<body>
<div class="c">
  <!--
    blocks: brand-block 240x288 slab (x560), gold 160x160 (top right), red 80x48, gold-light 80x128; radius-0 throughout
    arrangement: one tall navy slab bleeding top and bottom with three satellites stacked to its right, as the crest stacks navy, gold and red
    pattern: literal motif row, three crossing orbit ellipses plus a nucleus disc (radius-full), because the Q-atom is the brand's own mark
    scales: space-5 (40px) text inset, space-4 multiples for block sides (80, 160, 240), radius-0 for blocks, radius-full for the nucleus
  -->
  <svg width="960" height="288" viewBox="0 0 960 288" aria-hidden="true">
    <rect class="navy" x="560" y="0" width="240" height="288"/>
    <rect class="gold" x="800" y="0" width="160" height="160"/>
    <rect class="red" x="800" y="160" width="80" height="48"/>
    <rect class="goldl" x="880" y="160" width="80" height="128"/>
    <g transform="translate(680 144)">
      <ellipse class="orbit" rx="96" ry="34"/>
      <ellipse class="orbit" rx="96" ry="34" transform="rotate(60)"/>
      <ellipse class="orbit" rx="96" ry="34" transform="rotate(-60)"/>
      <circle class="nuc" r="12"/>
    </g>
  </svg>
  <h1 class="name">Quantum IAS<br>&amp; PCS</h1>
  <p class="tag">Small steps, a quantum leap. Book covers for UPPSC, BPSC and UPSC.</p>
</div>
</body>
</html>
